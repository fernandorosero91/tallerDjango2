{% extends 'gestion/cbv/base.html' %}

{% block title %}{{ titulo }} — CBV{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto bg-white rounded-xl shadow p-8">
  <h1 class="text-xl font-bold text-emerald-900 mb-6">{{ titulo }}</h1>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {% for field in form %}
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}
        <p class="text-red-500 text-xs mt-1">{{ field.errors|join:", " }}</p>
      {% endif %}
    </div>
    {% endfor %}
    <div class="flex gap-3 pt-2">
      <button type="submit"
              class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm px-5 py-2 rounded shadow">
        Guardar
      </button>
      <a href="{{ cancelar_url }}"
         class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm px-5 py-2 rounded">
        Cancelar
      </a>
    </div>
  </form>
</div>
{% endblock %}
