{% extends 'gestion/base.html' %}

{% block title %}Eliminar {{ tipo }}{% endblock %}

{% block content %}

<h1>Eliminar {{ tipo }}</h1>
<p>¿Desea eliminar <strong>{{ objeto }}</strong>?</p>
<form method="post">

</form>
<a href="{{ cancelar_url }}">Cancelar</a>

{% endblock %}
