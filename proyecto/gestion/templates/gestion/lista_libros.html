{% extends 'gestion/base.html' %}

{% block title %}Lista de Libros{% endblock %}

{% block content %}

<h1>Libros</h1>
<a href="{% url 'crear_libro' %}">Agregar Libro</a>
<ul>
{% for libro in libros %}
    <li>{{ libro.titulo }} - {{ libro.autor }} ({{ libro.genero }})
        <a href="{% url 'editar_libro' libro.pk %}">Editar</a>
        <a href="{% url 'eliminar_libro' libro.pk %}">Eliminar</a>
    </li>
{% endfor %}
</ul>

{% endblock %}
