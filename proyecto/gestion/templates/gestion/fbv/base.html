<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Gestión FBV{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans">

  <nav class="bg-blue-700 text-white px-6 py-3 flex gap-6 items-center shadow">
    <span class="font-bold text-lg tracking-wide">📘 Gestión FBV</span>
    <a href="/" class="hover:underline text-sm">Inicio</a>
    <a href="/autores/" class="hover:underline text-sm">Autores</a>
    <a href="/libros/" class="hover:underline text-sm">Libros</a>
    <span class="ml-auto text-xs opacity-60">Function-Based Views</span>
  </nav>

  <main class="max-w-4xl mx-auto mt-10 px-4">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
